<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daylog</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="daylog">

        <!-- Header -->
        <header class="app-header">
            <h1>DAYLOG</h1>
            <p>오늘을 기록하고 내일을 준비하세요.</p>
            
            <!-- 날짜 이동-->
            <div class="date-navigation">
                <button id="prev-date"><</button>
                <button id="today-button">오늘</button>
                <div id="current-date"></div>
                <button id="next-date">></button>
            </div>
        </header>

        <!-- 월별 캘린더-->
        <section class="calendar-section">
            <div class="calendar-hearder">
                <button id="prev-month"><</button>
                <h2 id="calendar-title"></h2>
                <button id="next-month">></button>
            </div>
            <div class="calendar-weekdays">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>
            <div id="calendar" class="calendar">

            </div>
        </section>

        <!-- 계획 & 실행 -->
        <section class="section">
            <h3>계획 & 실행</h3>

            <div class="schedule">
                <div class="schedule-item">
                    <span class="time">09:00</span>
                    <span class="title">웹개발 공부</span>
                </div>

                <div class="schedule-item">
                    <span class="time">13:00</span>
                    <span class="title">점심</span>
                </div>

                <div class="schedule-item">
                    <span class="time">15:00</span>
                    <span class="title">운동</span>
                </div>
            </div>
        </section>


        <!-- 다짐 -->
        <section class="section">
            <h3>다짐</h3>

            <textarea
                id = "promise"
                class="text-input"
                placeholder="오늘의 다짐을 적어보세요."
            ></textarea>
        </section>


        <!-- 오늘 할 일 -->
        <section class="section">
            
            <div class="todo-header">
                <h3>오늘의 할 일</h3>
                <div class="todo-progress">
                    <span id="todo-count">0/0</span>
                    <div class="progress-bar">
                        <div id="todo-progress-fill"></div>
                    </div>
                </div>
            </div>

            <div id="todo-list" class="todo-list">
            </div>

            <div class="todo-input-area">
                <input
                    id="todo-input"
                    type="text"
                    placeholder="할 일을 입력하세요"
                >
                <button id="add-todo">
                    + 할 일 추가
                </button>
            </div>
        </section>


        <!-- 오늘의 기록 -->
        <section class="section">

            <h3>오늘의 기록</h3>

            <div class="record-grid">

                <div class="record-card">
                    <h3>일기</h3>
                    <textarea 
                        id = "diary"
                        placeholder="오늘 하루는 어땠나요?">
                    </textarea>
                </div>

                <div class="record-card">
                    <h3>메모</h3>
                    <textarea 
                        id="memo"
                        placeholder="기억하고 싶은 내용을 적어보세요."
                    ></textarea>
                </div>

                <div class="record-card">
                    <h3>감사</h3>
                    <textarea
                        id="gratitude"
                        placeholder="오늘 감사했던 일을 적어보세요."
                    ></textarea>
                </div>

                <div class="record-card">
                    <h3>칭찬</h3>
                    <textarea 
                        id="compliment"
                        placeholder="오늘 나를 칭찬해주세요."
                    ></textarea>
                </div>

                <div class="record-card">
                    <h3>반성</h3>
                    <textarea 
                        id="reflection"
                        placeholder="아쉬웠던 점을 적어보세요."
                    ></textarea>
                </div>

                <div class="record-card">
                    <h3>교훈</h3>
                    <textarea 
                        id="lesson"
                        placeholder="오늘 배운 것을 적어보세요."
                    ></textarea>
                </div>

            </div>

        </section>


        <!-- 내일 할 일 -->
        <section class="section">
            <h3>내일 할 일</h3>

            <textarea
                id="tomorrow"
                class="text-input"
                placeholder="내일 해야 할 일을 적어보세요."
            ></textarea>
        </section>


    </main>

    <script src="./js/script.js"></script>

</body>
</html>
